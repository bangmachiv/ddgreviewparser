name: Extract Title Highlights

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-highlighter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai 

      - name: Run Highlight Extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: |
          # REMOVED "ddgreviewparser/" prefix here
          python highlight_extractor.py

      - name: Commit and Push to Repository
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # REMOVED "ddgreviewparser/" prefix here
          git add data/reviews/*.json
          
          if git diff --staged --quiet; then
            echo "No new highlights were added. Skipping commit."
          else
            git commit -m "chore: auto-extract and save title highlights"
            git push
            echo "Successfully committed and pushed updated JSON files!"
          fi
