name: Extract Title Highlights

on:
  workflow_dispatch: # Run manually from the Actions tab
  # schedule:
  #   - cron: '0 2 * * *' # Uncomment to run automatically at a specific time

# 🚨 CRITICAL: Grants the action permission to push code back to the repo
permissions:
  contents: write

jobs:
  run-highlighter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # The script requires the new Gemini SDK
        run: pip install google-genai 

      - name: Run Highlight Extractor
        env:
          # Passes your secret API key safely to the Python script
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: |
          python ddgreviewparser/highlight_extractor.py

      - name: Commit and Push to Repository
        run: |
          # 1. Identity for the commit
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Stage the updated JSON files
          git add ddgreviewparser/data/reviews/*.json
          
          # 3. Check if any files were actually changed
          if git diff --staged --quiet; then
            echo "No new highlights were added. Skipping commit."
          else
            git commit -m "chore: auto-extract and save title highlights"
            git push
            echo "Successfully committed and pushed updated JSON files!"
          fi
