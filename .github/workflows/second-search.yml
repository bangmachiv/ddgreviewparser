name: Secondary Missing Review Search

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secondary-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run secondary search and merge
        run: |
          python second_search_reviews.py
          python merge_reviews.py

      - name: Commit updated search files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/searches/ data/reviews/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update secondary search and merged review results"
          git pull --rebase origin main
          git push
