name: Secondary Missing Review Search

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Optional: Uncomment to run daily (e.g., at 10:00 UTC)
  # schedule:
  #   - cron: "0 10 * * *"

jobs:
  secondary-search:
    runs-on: ubuntu-latest
    
    # Required to allow the GitHub Action bot to push commits
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures full git history for the rebase step
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs ddgs>=9.0.0 directly from your environment file
          pip install -r environment.txt

      - name: Run Secondary Search
        run: |
          python second_search_reviews.py

      - name: Commit and Push Results
        run: |
          # Set up bot identity for the commit
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the newly created JSON files in the searches directory
          git add data/searches/
          
          # Check if there are actually any new changes to commit
          if git diff --staged --quiet; then
            echo "No missing reviews were processed or found. Nothing to commit."
          else
            git commit -m "chore: add secondary search results for missing reviews"
            
            # Rebase to prevent race conditions if other workflows pushed changes
            git pull --rebase origin main
            
            git push origin main
          fi
