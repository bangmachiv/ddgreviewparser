name: Diagnostic Test - DDGS Movie Search

on:
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Run DDGS staged diagnostic
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u test_ddgs.py --output-dir diagnostic_output_py${{ matrix.python-version }}

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddgs-report-py${{ matrix.python-version }}
          path: diagnostic_output_py${{ matrix.python-version }}
          if-no-files-found: warn

  merge-report:
    needs: test-search
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download matrix reports
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: ddgs-report-py*

      - name: Merge and rank final report
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u test_ddgs.py --merge-only all_artifacts --output-dir final_ddgs_report

      - name: Upload final ranked report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddgs-final-ranked-report
          path: final_ddgs_report
          if-no-files-found: warn
