
name: Diagnostic Test - DDGS Movie Search

on:
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ddgs==9.16.1

      - name: Run movie search diagnostics
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u test_ddgs.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddgs-movie-search-report
          path: ddgs_diagnostic_results.json
          if-no-files-found: warn
```
