
name: Diagnostic Test - DDG Search

on:
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade ddgs

      - name: Run DDGS diagnostic tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u test_ddgs.py
