name: Extract Article Titles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-titles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # No external dependencies (like Playwright) are needed for this script
      - name: Run extraction script
        run: python extract_titles.py

      # बिलकुल वही Git Commands जो आपकी डाउनलोड स्क्रिप्ट में काम कर रहे हैं
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git status
          git commit -m "Update article titles in reviews JSON" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
