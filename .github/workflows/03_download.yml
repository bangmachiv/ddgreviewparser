name: 03. Download HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # 1. OPTIMIZATION: Caches pip packages to shave 10-15 seconds off future runs

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright playwright-stealth curl_cffi

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          # 2. OPTIMIZATION: Strictly limits OS-level dependency fetching to Chromium.
          # This prevents the 3-5 minute silent hang caused by Ubuntu unpacking fonts for WebKit/Firefox.
          playwright install chromium
          playwright install-deps chromium

      - name: Run download script
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          PYTHONUNBUFFERED: 1  # 3. OPTIMIZATION: Forces Python to stream logs to GitHub Actions in real-time
        run: |
          python 03_download.py

      - name: Commit updated JSON, Logs, and HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Safely stage directories to prevent wildcard crash errors
          git add data/reviews/ data/webpages/ logs/
          
          if git diff --cached --quiet; then
            echo "No changes to commit. All webpages are up to date."
            exit 0
          fi
          
          git commit -m "Pipeline [03]: Update downloaded HTML and review statuses"
          git push

      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-webpages
          path: data/webpages/
          retention-days: 7
