name: Download Publisher HTML

# Allows you to trigger this workflow manually from the GitHub Actions tab
on:
  workflow_dispatch:

jobs:
  download-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run download script
        run: python download_html.py

      # This step saves the downloaded HTML file so you can access it
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-webpages
          path: data/webpages/
          retention-days: 7
