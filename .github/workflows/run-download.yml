name: Download Publisher HTML

on:
  workflow_dispatch:

# NEW: We must give the GitHub Action permission to push changes to your repo
permissions:
  contents: write

jobs:
  download-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright playwright-stealth
          playwright install --with-deps chromium

      - name: Run download script
        run: python download_html.py

      # NEW: This commits the updated JSON file back to your GitHub repository!
      - name: Commit updated JSON file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/reviews/*.json
          git commit -m "Auto-update extraction status (Y/N) in JSON" || echo "No changes to commit"
          git push

      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-webpages
          path: data/webpages/
          retention-days: 7
