name: Classify Reviews

on:
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run review classifier
        run: |
          python classify_reviews.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/searches/*.json
          git add data/reviews/*.json

          git diff --cached --quiet || git commit -m "Update classified reviews"

          git push
