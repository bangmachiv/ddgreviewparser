name: Diagnostic Test - Serper.dev API

on:
  workflow_dispatch:

jobs:
  test-serper:
    runs-on: ubuntu-latest
    
    # Forces Python unbuffered mode globally as a secondary safeguard
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Serper Test
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python test_serper.py
