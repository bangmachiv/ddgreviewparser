name: Master Review Pipeline

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *' # Uncomment this later if you want it to run daily automatically

# Prevents multiple instances of this workflow from running simultaneously and causing collisions
concurrency:
  group: "review-automation-pipeline"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    # Hard stop if the process gets trapped in an infinite browser hang
    timeout-minutes: 45 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Added duckduckgo-search to fix the ddgs ModuleNotFoundError
          pip install requests playwright playwright-stealth duckduckgo-search
          playwright install --with-deps chromium

      - name: Step 1 - Search for Reviews
        run: python search_reviews.py

      - name: Step 2 - Classify and Filter Valid Reviews
        run: python classify_reviews.py

      - name: Step 3 - Download HTML Webpages
        run: python download_html.py

      - name: Step 4 - Parse JSON-LD Data for Ratings
        run: python parse_jsonld.py

      # This step executes to save your scraped data even if a previous script crashes
      - name: Sync and Push Output Data
        if: success() || failure()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the specific data directory to avoid committing unrelated runner junk
          git add data/
          
          if git diff --cached --quiet; then
            echo "No changes were made by the scripts. Skipping commit."
          else
            # 1. Commit the local changes generated by the runner
            git commit -m "Automated Pipeline Update: Searches, Classifications, Webpages, and Ratings"
            
            # 2. Pull remote background changes using autostash to prevent merge conflicts
            git pull origin ${{ github.ref_name }} --rebase --autostash
            
            # 3. Push the finalized data back to the repository
            git push origin HEAD:${{ github.ref }}
          fi
