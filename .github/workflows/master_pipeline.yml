name: 06. Active Movies Pipeline

on:
  workflow_dispatch:
  schedule:
    # Set to run 30 minutes after your Activation Manager cron times
    - cron: '30 0,6,12,18 * * *' 

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 groq playwright
          playwright install chromium

      - name: 00 - Initialize
        run: python 00_initialize.py

      - name: 01 - Search
        run: python 01_search.py

      - name: 02 - Identify
        run: python 02_identify.py

      - name: 03 - Download
        run: python 03_download.py

      - name: 04-A - Extract, Clean & Highlight Titles
        run: |
          python 04-A-1_titles.py
          python 04-A-2_clean.py
          python 04-A-3_highlight.py

      - name: 04-B - Metadata & AI Processing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python 04-B-1_metadata-jsonld.py
          python 04-B-2_metadata-ai.py
          python 04-B-3_label.py

      - name: 05-A - WhatsApp Formatting
        run: python 05-A_wsap.py

      - name: 05-B - JSON Summary Output
        run: python 05-B_summary.py

      - name: 06 - Pipeline Metrics Dashboard
        run: |
          if [ -f "06_pipeline-live.py" ]; then
            python 06_pipeline-live.py
          fi

      - name: Commit and Push Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ logs/
          git commit -m "Pipeline Auto-Update: Skeletons, Logs, Webpages, and Summaries" || echo "No changes to commit"
          git push
