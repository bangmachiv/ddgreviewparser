name: Master Review Pipeline

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *'

concurrency:
  group: "review-automation-pipeline"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install requests playwright playwright-stealth curl_cffi duckduckgo-search ddgs google-genai groq beautifulsoup4 lxml
          playwright install --with-deps chromium

      # ----------------------------------------------------
      # 1. DISCOVERY & SCRAPING
      # ----------------------------------------------------
      - name: 01 - Search Reviews
        run: python -u 01_search.py

      - name: 02 - Identify Reviews
        run: python -u 02_identify.py

      - name: 03 - Download HTML Webpages
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python -u 03_download.py

      # ----------------------------------------------------
      # 2. TITLE EXTRACTION & REFINEMENT
      # ----------------------------------------------------
      - name: 04-A-1 - Extract Titles
        run: python -u 04-A-1_titles.py

      - name: 04-A-2 - Clean Titles (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u 04-A-2_clean.py

      - name: 04-A-3 - Highlight Titles (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u 04-A-3_highlight.py

      # ----------------------------------------------------
      # 3. METADATA & SENTIMENT PROCESSING
      # ----------------------------------------------------
      - name: 04-B-1 - Metadata JSON-LD Parsing
        run: python -u 04-B-1_metadata-jsonld.py

      - name: 04-B-2 - Metadata AI Fallback (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u 04-B-2_metadata-ai.py

      - name: 04-B-3 - Unrated Title Sentiment Labeling (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u 04-B-3_label.py

      # ----------------------------------------------------
      # 4. OUTPUT GENERATION
      # ----------------------------------------------------
      - name: 05-A - Generate WhatsApp Output
        run: |
          shopt -s nullglob
          for file in data/reviews/reviews_*.json; do
            echo "Generating WhatsApp output for $file"
            python -u 05-A_wsap.py "$file"
          done

      # ----------------------------------------------------
      # 5. PIPELINE SUMMARY REPORT
      # ----------------------------------------------------
      - name: 05-B - Print & Save Pipeline Summary
        if: always()
        run: python -u 05-B_pipeline.py

      # ----------------------------------------------------
      # COMMIT & PUSH
      # ----------------------------------------------------
      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add data/ logs/
          git status
          
          if git diff --cached --quiet; then
            echo "No data or log modifications to commit."
            exit 0
          fi
          
          git commit -m "Pipeline Run: Processed reviews, generated outputs, and updated logs"
          git pull origin ${{ github.ref_name }} --rebase --autostash || true
          git push origin HEAD:${{ github.ref }}
