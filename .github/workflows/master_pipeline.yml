name: Master Review Pipeline

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *' 

concurrency:
  group: "review-automation-pipeline"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180 
    
    # REQUIRED: Forces Python to flush standard output directly to the terminal in real-time
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Install base scraping dependencies from the repo file (if it exists)
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          
          # 2. Force install all known external libraries for AI and Web Automation
          pip install requests playwright playwright-stealth curl_cffi duckduckgo-search ddgs google-genai beautifulsoup4 lxml
          
          # 3. Install headless browser components
          playwright install --with-deps chromium

      # ----------------------------------------------------
      # 1. PREP SUBFLOW
      # ----------------------------------------------------
      - name: Prep 1 - Search for Reviews
        run: python search_reviews.py

      - name: Prep 2 - Classify and Filter Valid Reviews
        run: python classify_reviews.py

      - name: Prep 3 - Download HTML Webpages
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python download_html.py

      # ----------------------------------------------------
      # 2. TITLE SUBFLOW
      # ----------------------------------------------------
      - name: Title 1 - Extract Raw Article Titles
        run: python extract_titles.py

      - name: Title 2 - Clean Titles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python clean_titles.py || { echo "Gemini title cleaning script crashed!"; exit 1; }

      - name: Title 3 - Extract Highlighted Titles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python highlight_extractor.py || { echo "Highlight extraction script crashed!"; exit 1; }

      # ----------------------------------------------------
      # 3. RATING SUBFLOW
      # ----------------------------------------------------
      - name: Rating 1 - Parse JSON-LD Data for Ratings
        run: python parse_jsonld.py

      - name: Rating 2 - Extract Missing Metadata (Ratings/Critics)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python extract_missing_metadata.py || { echo "Metadata extraction script crashed!"; exit 1; }

      - name: Rating 3 - Classify Unrated Sentiments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_sentiment_classifier.py || { echo "AI Sentiment classification script crashed!"; exit 1; }

      # ----------------------------------------------------
      # 4. OUTPUT SUBFLOW
      # ----------------------------------------------------
      - name: Output 1 - Generate WhatsApp Messages
        run: |
          for file in data/reviews/reviews_*.json; do
            if [ -f "$file" ]; then
              echo "Generating WhatsApp output for $file"
              python wsap_output_creator.py "$file"
            fi
          done

      # ----------------------------------------------------
      # COMMIT & PUSH (Runs even if a script fails)
      # ----------------------------------------------------
      - name: Sync and Push Output Data
        if: success() || failure()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add data/
          
          if git diff --cached --quiet; then
            echo "No changes were made by the scripts. Skipping commit."
          else
            git commit -m "chore: Automated Pipeline Update - Prep, Titles, Ratings, Outputs"
            git pull origin ${{ github.ref_name }} --rebase --autostash
            git push origin HEAD:${{ github.ref }}
          fi
