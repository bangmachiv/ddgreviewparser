name: Parse JSON-LD New

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-jsonld:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
          
      - name: Run parser script
        run: python parse_jsonld.py

      # बिलकुल वही Git Commands जो आपकी डाउनलोड स्क्रिप्ट में काम कर रहे हैं
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git status
          git commit -m "Update critic names and star ratings" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
