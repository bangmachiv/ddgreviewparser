name: Parse JSON-LD

on:
  workflow_dispatch:

# You MUST have this permission block so GitHub allows the bot to save files
permissions:
  contents: write

jobs:
  parse-jsonld:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
          
      - name: Run parser script
        run: python parse_jsonld.py

      # THIS IS THE MISSING STEP THAT SAVES YOUR DATA
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the ENTIRE reviews folder. This guarantees it catches the updated file perfectly.
          git add data/reviews/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update critic names and star ratings"
            git push
          fi
