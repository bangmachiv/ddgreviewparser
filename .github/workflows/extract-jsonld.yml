name: Extract JSON-LD Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: |
          python -c "from playwright.sync_api import sync_playwright; print('Playwright installed successfully')"

      - name: Run extractor
        run: |
          python parse_jsonld.py data/reviews/reviews_2026-bhai-tera-star-hai.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the entire directory to ensure it catches the updated file
          git add data/reviews/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update critic names and star ratings"
            git push
          fi
