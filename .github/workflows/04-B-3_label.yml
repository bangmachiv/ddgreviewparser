name: 04-B-3. Sentiment Label (Groq OSS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  label-sentiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run OSS Sentiment Labeler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"  
        run: |
          python -u 04-B-3_label.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add data/reviews/ logs/
          git status
          
          if git diff --cached --quiet; then
            echo "No changes to commit. All sentiment labels completed."
            exit 0
          fi
          
          git commit -m "Pipeline [04-B-3]: Groq OSS sentiment classification applied"
          git push origin HEAD:${{ github.ref }}
