name: 04-B-3. Sentiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  label-sentiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run OSS Dummy Test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"  
        run: |
          # The -u flag forces the binary to operate unbuffered
          python -u 04-B-3_label.py
