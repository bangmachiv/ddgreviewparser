name: 01. DuckDuckGo Search

on:
  workflow_dispatch:
  # Uncomment the lines below to enable continuous polling from Thu to Sun
  # schedule:
  #   - cron: '0 4,10,16 * * 0,4-6'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo-search

      - name: Run search script
        run: |
          python 01_search.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update DDGS search results and review metrics"
          file_pattern: "data/**/*.json logs/**/*.json"
